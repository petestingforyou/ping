<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso al sistema</title>

<link rel="stylesheet" href="css/estilos.css">

</head>


<body>


<div class="contenedor-formulario">


<h1>Registro de Retiros</h1>


<h2>Inicio de sesión</h2>



<form id="loginForm">


<label for="usuario">
Usuario:
</label>


<input 
type="text" 
id="usuario"
required>




<label for="password">
Contraseña:
</label>


<input 
type="password"
id="password"
required>




<button type="submit">
Ingresar
</button>



</form>



<p id="mensaje"></p>



</div>





<script type="module" src="js/login.js"></script>

</body>

</html>
