<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de retiros</title>

<link rel="stylesheet" href="css/estilos.css">

</head>


<body>


<div class="contenedor-consulta">


<h2>Consulta de movimientos</h2>



<div class="resumen">

    <p>
        Movimientos:
        <strong id="totalRegistros">0</strong>
    </p>


    <p>
        Total:
        <strong id="totalCantidad">$0.00</strong>
    </p>

</div>




<div class="busqueda">


    <input 
    type="text" 
    id="buscar" 
    placeholder="Buscar usuario o folio">


</div>





<div class="filtros-fecha">


    <label>
        Desde:
        <input type="date" id="fechaInicio">
    </label>



    <label>
        Hasta:
        <input type="date" id="fechaFin">
    </label>



    <button id="limpiarFiltro">
        Limpiar
    </button>


</div>





<table class="tabla-consulta">


<thead>

<tr>

<th>Usuario</th>

<th>Folio Retiro</th>

<th>Folio Depósito</th>

<th>Cantidad</th>

<th>Fecha</th>

</tr>

</thead>



<tbody id="tablaDatos">

</tbody>



</table>





<button id="salir">
Cerrar sesión
</button>



</div>







<script type="module">
import { validarRol, cerrarSesion } from "./js/seguridad.js";

validarRol("consultor");

import { db } from "./js/firebase.js";



import {

collection,

getDocs

} from

"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";





const tabla = document.getElementById("tablaDatos");


const buscar = document.getElementById("buscar");


const fechaInicio = document.getElementById("fechaInicio");


const fechaFin = document.getElementById("fechaFin");


const limpiarFiltro = document.getElementById("limpiarFiltro");



const totalRegistros = document.getElementById("totalRegistros");


const totalCantidad = document.getElementById("totalCantidad");




let registros = [];






// Leer colección retiros

const consulta = await getDocs(

    collection(db,"retiros")

);






// Guardar registros

consulta.forEach((doc)=>{


    registros.push(doc.data());


});






// Ordenar del más reciente al más antiguo


registros.sort(

    (a,b)=> b.fecha.seconds - a.fecha.seconds

);







// Mostrar registros

function mostrarRegistros(datos){



    tabla.innerHTML = "";



    let suma = 0;





    datos.forEach((dato)=>{



        suma += Number(dato.cantidad);




        tabla.innerHTML += `


        <tr>


            <td>${dato.usuario}</td>


            <td>${dato.folioRetiro}</td>


            <td>${dato.folioDeposito}</td>


            <td>

            ${Number(dato.cantidad).toLocaleString("es-MX",{

                style:"currency",

                currency:"MXN"

            })}


            </td>



            <td>

            ${dato.fecha.toDate().toLocaleString("es-MX")}


            </td>


        </tr>


        `;



    });





    totalRegistros.textContent = datos.length;



    totalCantidad.textContent = suma.toLocaleString("es-MX",{

        style:"currency",

        currency:"MXN"

    });



}









// Aplicar filtros

function aplicarFiltros(){



    const texto = buscar.value.toLowerCase();





    const inicio = fechaInicio.value

    ? new Date(fechaInicio.value + "T00:00:00")

    : null;





    const fin = fechaFin.value

    ? new Date(fechaFin.value + "T23:59:59")

    : null;







    const filtrados = registros.filter((dato)=>{



        const fechaRegistro = dato.fecha.toDate();






        const coincideTexto =



        dato.usuario.toString().toLowerCase().includes(texto)



        ||

        

        dato.folioRetiro.toString().toLowerCase().includes(texto)



        ||



        dato.folioDeposito.toString().toLowerCase().includes(texto);








        const coincideFecha =



        (!inicio || fechaRegistro >= inicio)



        &&



        (!fin || fechaRegistro <= fin);






        return coincideTexto && coincideFecha;



    });






    mostrarRegistros(filtrados);



}









// Eventos

buscar.addEventListener(

"input",

aplicarFiltros

);



fechaInicio.addEventListener(

"change",

aplicarFiltros

);



fechaFin.addEventListener(

"change",

aplicarFiltros

);







// Limpiar filtros


limpiarFiltro.addEventListener("click",()=>{



    buscar.value = "";

    fechaInicio.value = "";

    fechaFin.value = "";



    mostrarRegistros(registros);



});







// Carga inicial


mostrarRegistros(registros);

// Cerrar sesión
document.getElementById("salir").addEventListener("click", cerrarSesion);



</script>



</body>

</html>
