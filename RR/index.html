<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Retiros</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>


<body>


    <div class="contenedor-formulario">

        
        <h1>Registro de Retiros</h1>


<p>
Usuario conectado:
<strong id="usuarioSesion"></strong>
</p>


<form id="registroForm">

    <label for="folioRetiro">
    Folio Retiro:
    </label>

    <input type="text" id="folioRetiro" required>


    <label for="folioDeposito">
    Folio Depósito:
    </label>

    <input type="text" id="folioDeposito" required>


    <label for="cantidad">
    Cantidad:
    </label>

    <input type="number" id="cantidad" step="0.01" required>


    <button type="submit">
    Guardar
    </button>

</form>

<button id="salir">
Cerrar sesión
</button>

        <p id="mensaje"></p>


    </div>



    <script type="module">

import { cerrarSesion } from "./js/seguridad.js";

import "./js/app.js";



document.getElementById("salir")
.addEventListener("click", cerrarSesion);


</script>


</body>

</html>
