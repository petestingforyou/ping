<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Reporte PDF Productos</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
    padding:30px;
}

.contenedor{
    background:white;
    max-width:700px;
    margin:auto;
    padding:30px;
    border-radius:10px;
}

button{
    padding:15px;
    font-size:16px;
    cursor:pointer;
}

</style>

</head>


<body>


<div class="contenedor">

<h1>📦 Sistema de Revisión</h1>

<p>
Ejemplo de generación de reporte profesional en PDF
</p>


<button onclick="generarPDF()">
    Generar PDF
</button>


</div>



<script>


function generarPDF(){


const { jsPDF } = window.jspdf;


const doc = new jsPDF();



/* ENCABEZADO */

doc.setFontSize(18);
doc.text(
    "REPORTE DE PRODUCTOS CADUCADOS",
    105,
    20,
    {align:"center"}
);


doc.setFontSize(11);

doc.text(
    "Fecha de revisión: 28/07/2026",
    20,
    35
);


doc.text(
    "Usuario responsable: 4020",
    20,
    42
);


doc.text(
    "Área: Abarrotes",
    20,
    49
);



/* TABLA */


doc.autoTable({

    startY:60,

    head:[

        [
            "Código",
            "Producto",
            "Ubicación",
            "Caducidad",
            "Estado"
        ]

    ],


    body:[

        [
            "750100000001",
            "Leche Entera",
            "Anaquel A1",
            "15/08/2026",
            "Vigente"
        ],

        [
            "750100000002",
            "Galletas",
            "Anaquel B3",
            "30/07/2026",
            "Próximo"
        ],

        [
            "750100000003",
            "Refresco",
            "Anaquel C2",
            "10/07/2026",
            "CADUCADO"
        ]

    ]

});



/* PIE */


let pagina = doc.internal.getNumberOfPages();


doc.setFontSize(10);

doc.text(
    "Documento generado por Sistema de Revisión",
    20,
    285
);


doc.text(
    "Página " + pagina,
    170,
    285
);



doc.save("Reporte_Caducados.pdf");


}


</script>


</body>
</html>
