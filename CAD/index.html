<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Productos Caducados</title>

    <link
        rel="stylesheet"
        href="estilo.css"
    >

</head>


<body>

    <div class="contenedor">

        <h1>📦 Productos Caducados</h1>

        <div id="reader"></div>


        <div class="resultado">

            <h2>Resultado</h2>

            <div id="codigo">
                Esperando escaneo...
            </div>

        </div>


        <!-- ENTRADA MANUAL -->

        <div
            id="manual"
            class="manual"
        >

            <h3>
                Ingresar código manualmente
            </h3>

            <label for="entradaManual">
                Código de barras
            </label>

            <input
                type="text"
                id="entradaManual"
                placeholder="Escribe el código"
            >

            <button
                id="btnManual"
                type="button"
            >
                Buscar producto
            </button>

        </div>

    </div>


    <!-- html5-qrcode -->

    <script
        src="https://unpkg.com/html5-qrcode"
    ></script>


    <!-- Catálogo -->

    <script src="productos.js"></script>


    <!-- Aplicación -->

    <script
        type="module"
        src="app.js"
    ></script>

</body>

</html>
