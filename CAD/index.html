<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos Caducados</title>

    <link rel="stylesheet" href="estilo.css">

</head>

<body>

    <div class="contenedor">

        <h1>📦 Productos Caducados</h1>

        <div id="reader"></div>

        <div class="resultado">

            <h2>Producto detectado</h2>

            <div id="codigo" class="producto-card">

                <p>Esperando escaneo...</p>

            </div>

        </div>

        <div id="manual" style="display:none;">

            <label for="entradaManual">
                Ingresar código:
            </label>

            <input
                type="text"
                id="entradaManual"
            >

            <button id="btnManual">
                Aceptar
            </button>

        </div>

    </div>


    <!-- Lector de códigos -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Aplicación -->
    <script type="module" src="app.js"></script>

</body>

</html>
