<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Productos Caducados</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #f3f4f6;

        }

        .menu {

            width: 90%;

            max-width: 420px;

            background: white;

            padding: 35px 30px;

            border-radius: 16px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.12);

            text-align: center;

        }

        .menu h1 {

            margin-top: 0;

            margin-bottom: 8px;

            font-size: 25px;

            color: #222;

        }

        .menu p {

            margin-top: 0;

            margin-bottom: 30px;

            color: #666;

        }

        .opcion {

            width: 100%;

            padding: 18px;

            margin-bottom: 15px;

            border: none;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }

        .opcion:hover {

            transform: translateY(-2px);

        }

        .ingresar {

            background: #2563eb;

            color: white;

        }

        .reporte {

            background: #374151;

            color: white;

        }

    </style>

</head>


<body>

    <main class="menu">

        <h1>
            Productos Caducados
        </h1>

        <p>
            Selecciona una opción
        </p>


        <button
            class="opcion ingresar"
            onclick="location.href='index.html'"
        >

            📦 Ingresar producto

        </button>


        <button
            class="opcion reporte"
            onclick="location.href='reporte.html'"
        >

            📄 Generar reporte

        </button>

    </main>

</body>

</html>
