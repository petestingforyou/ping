<!DOCTYPE html>

<html lang="es">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PassBar API Callback</title>


</head>

<body>

<script>

(function () {

    try {

        const hash =
            window.location.hash.substring(1);

        const parametros =
            new URLSearchParams(hash);

        const datos =
            parametros.get("datos");

        if (!datos) {

            throw new Error(
                "No se recibieron datos del servidor."
            );

        }

        /*
         * URLSearchParams ya decodifica
         * automáticamente el valor del parámetro.
         */
        const respuesta =
            JSON.parse(datos);

        /*
         * Enviamos la respuesta a Pc.html.
         *
         * Usamos "*" aquí porque esta página
         * puede ser cargada desde un iframe
         * después de pasar por Apps Script.
         *
         * Pc.html será quien valide el origen
         * y el requestId.
         */
        window.parent.postMessage(

            {
                tipo:
                    "PASSBAR_API",

                requestId:
                    respuesta.requestId || "",

                datos:
                    respuesta
            },

            "*"

        );

    } catch (error) {

        window.parent.postMessage(

            {
                tipo:
                    "PASSBAR_API",

                requestId:
                    "",

                datos: {

                    ok:
                        false,

                    mensaje:
                        error.message ||
                        "Error al procesar la respuesta del servidor."

                }

            },

            "*"

        );

    }

})();

</script>

</body>

</html>
