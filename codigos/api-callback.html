<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PassBar API Callback</title>

</head>

<body>

<script>

(function () {

    try {

        const hash =
            window.location.hash.substring(1);

        const parametros =
            new URLSearchParams(hash);

        const datosTexto =
            parametros.get("datos");

        if (!datosTexto) {

            throw new Error(
                "No se recibieron datos del servidor."
            );

        }

        /*
         * URLSearchParams ya realiza la
         * decodificación del parámetro.
         */
        const datos =
            JSON.parse(
                datosTexto
            );

        /*
         * IMPORTANTE:
         *
         * No usamos window.parent.
         *
         * Esta página puede estar dentro
         * del iframe de Apps Script.
         *
         * window.top apunta directamente
         * a Pc.html.
         */
        window.top.postMessage(

            {
                tipo:
                    "PASSBAR_API",

                requestId:
                    datos.requestId || "",

                datos:
                    datos
            },

            "https://petestingforyou.github.io"

        );

    } catch (error) {

        window.top.postMessage(

            {
                tipo:
                    "PASSBAR_API",

                requestId:
                    "",

                datos: {

                    ok:
                        false,

                    mensaje:
                        error.message ||
                        "Error al procesar la respuesta del servidor."

                }

            },

            "https://petestingforyou.github.io"

        );

    }

})();

</script>

</body>

</html>
